[project]
name = "businessos-backend"
version = "0.1.0"
description = "BusinessOS AI — backend (FastAPI, async SQLAlchemy, Celery)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]==3.5.0",
  "cryptography>=42",
  "bcrypt>=4.2",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "loguru>=0.7",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated, machine-formatted — not meant for hand-tuned style, same as
# excluding Django-style migrations from lint in other stacks.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
